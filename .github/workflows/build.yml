# GitHub Actions workflow for building, testing, verifying, and preparing plugin release drafts:
# - Build the plugin ZIP with the 'buildPlugin' task and upload it as a workflow artifact.
# - Run the 'check' task and upload test reports on failure.
# - Run the 'verifyPlugin' task and upload Plugin Verifier reports.
# - Create a draft GitHub release on non-pull-request runs.
#
# The workflow is triggered on pushes to the 'main' branch and on pull_request events.
#
# The repository variable CI_RUNS_ON selects the runner, as a JSON value for 'runs-on':
# - not set: "ubuntu-latest" (GitHub-hosted);
# - ["self-hosted","linux","t3-ci"]: the Docker runner of ci/runner (see ci/README.md).
# A pull request from a fork always uses "ubuntu-latest", whatever the value of CI_RUNS_ON.
# The 'releaseDraft' job never runs on pull requests, so it uses CI_RUNS_ON without this rule.
# The GitHub-hosted runner needs the disk, Java and Gradle setup steps; the t3-ci image has Java,
# and its volumes keep the dependencies, the IDEs, the build cache, the Plugin Verifier downloads
# and the workspace with the Gradle project caches between runs.
#
# GitHub Actions reference: https://docs.github.com/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Build the plugin, run the tests and the plugin verification in one Gradle invocation
  build:
    name: Build, test and verify
    # A pull request from a fork always runs on "ubuntu-latest": its code never runs on the self-hosted runner.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:

      # Free GitHub Actions Environment Disk Space (GitHub-hosted only: it deletes system directories)
      - name: Maximize Build Space
        if: ${{ runner.environment == 'github-hosted' }}
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      # Check out the current repository. The self-hosted runner keeps its workspace between jobs:
      # the next step cleans it and keeps the Gradle project caches (configuration cache, IntelliJ Platform files).
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # Delete the untracked and ignored files of the previous job, except the Gradle project caches
      - name: Clean Workspace
        if: ${{ runner.environment == 'self-hosted' }}
        run: git clean -ffdx -e /.gradle/ -e /.intellijPlatform/ -e /.kotlin/

      # Set up the Java environment for the next steps
      - name: Setup Java
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        if: ${{ runner.environment == 'github-hosted' }}
        uses: gradle/actions/setup-gradle@v6

      # Build the plugin, run the tests and the Plugin Verifier
      - name: Build, test and verify plugin
        run: ./gradlew buildPlugin check verifyPlugin --console=plain

      # Store an already-built plugin as an artifact for downloading
      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip
          if-no-files-found: ignore

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests
          if-no-files-found: ignore

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
          if-no-files-found: ignore

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, the release workflow would be triggered
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build ]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:

      # Check out the current repository. The self-hosted runner keeps its workspace between jobs:
      # the next step cleans it and keeps the Gradle project caches (configuration cache, IntelliJ Platform files).
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      # Delete the untracked and ignored files of the previous job, except the Gradle project caches
      - name: Clean Workspace
        if: ${{ runner.environment == 'self-hosted' }}
        run: git clean -ffdx -e /.gradle/ -e /.intellijPlatform/ -e /.kotlin/

      # Set up the Java environment for the next steps
      - name: Setup Java
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        if: ${{ runner.environment == 'github-hosted' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=$RELEASE_NOTE

          gh release create $VERSION \
            --draft \
            --title $VERSION \
            --notes-file $RELEASE_NOTE
