# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # The Marketplace accepts each plugin version once, in any channel. If the version of the tag
      # (gradle.properties) is already there, for example a pre-release promoted to a release, skip the release steps.
      - name: Check Marketplace Version
        id: marketplace
        env:
          PLUGIN_ID: com.bicf.t3plugin
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *//p' gradle.properties)"
          API="https://plugins.jetbrains.com/api/plugins"
          EXISTS=false
          STATUS="$(curl -s -o "$RUNNER_TEMP/plugin.json" -w '%{http_code}' "$API/intellij/$PLUGIN_ID")"
          if [ "$STATUS" = 200 ]; then
            ID="$(jq -r '.id' "$RUNNER_TEMP/plugin.json")"
            CHANNELS="$(curl -sf "$API/$ID/channels")"
            while IFS= read -r CHANNEL; do
              PAGE=1
              while :; do
                UPDATES="$(curl -sf --get "$API/$ID/updates" --data-urlencode "channel=$CHANNEL" --data "size=100" --data "page=$PAGE")"
                if jq -e --arg v "$VERSION" 'any(.[]; .version == $v)' <<< "$UPDATES" > /dev/null; then
                  EXISTS=true
                  echo "::notice::Version $VERSION is already on the Marketplace, channel '${CHANNEL:-default}'. The release steps are skipped."
                  break 2
                fi
                [ "$(jq 'length' <<< "$UPDATES")" -lt 100 ] && break
                PAGE=$((PAGE + 1))
              done
            done < <(jq -r '.[]' <<< "$CHANNELS")
          elif [ "$STATUS" != 404 ]; then
            echo "::error::The Marketplace API returned HTTP $STATUS for $PLUGIN_ID."
            exit 1
          fi
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ steps.marketplace.outputs.exists != 'true' && github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Publish the plugin to JetBrains Marketplace: a GitHub pre-release goes to the "beta" channel, a release to "default"
      - name: Publish Plugin
        if: ${{ steps.marketplace.outputs.exists != 'true' }}
        env:
          PUBLISH_CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'default' }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        if: ${{ steps.marketplace.outputs.exists != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

      # Create a pull request
      - name: Create Pull Request
        if: ${{ steps.marketplace.outputs.exists != 'true' && github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
